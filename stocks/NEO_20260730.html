* { margin:0; padding:0; box-sizing:border-box; }

.badge.closed { background:rgba(139,144,163,0.15); color:var(--dim); }
.badge.us { background:rgba(96,165,250,0.15); color:var(--accent); }

.timeline { border-left:2px solid var(--border); padding-left:16px; margin:8px 0; }
.tl-item { margin-bottom:14px; position:relative; }
.tl-item::before { content:''; position:absolute; left:-21px; top:6px;
                   width:8px; height:8px; border-radius:50%; background:var(--accent); }
.tl-item.sell::before { background:var(--red); }
.tl-item.buy::before { background:var(--green); }
.section-body { white-space:pre-wrap; font-size:0.92rem; }
.empty { text-align:center; padding:60px 20px; color:var(--dim); }
.footer { margin-top:40px; text-align:center; font-size:0.75rem; color:var(--dim); }
.table-wrap { overflow-x:auto; margin:12px 0; -webkit-overflow-scrolling:touch; }
.table-wrap table { margin:0; }
@media (max-width:520px) {
  body { padding:14px 8px; }
  h1 { font-size:1.25rem; }
  th, td { padding:8px 4px; font-size:0.8rem; }
  .badge { padding:2px 5px; font-size:0.68rem; }
  .card { padding:12px 14px; }
}
